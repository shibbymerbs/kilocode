# kilocode_change - new file
# Build-only VSIX pipeline. Unlike publish.yml (which is gated to Kilo-Org/kilocode
# and runs the full release), this produces the per-platform .vsix files as a
# workflow artifact so they can be downloaded and installed manually:
#   code --install-extension kilo-vscode-<platform>.vsix
#
# It does not compile the CLI. Instead it stages the prebuilt CLI platform
# packages from npm (same layout as packages/opencode/dist) and feeds them to
# packages/kilo-vscode/script/build.ts, which runs typecheck, lint, esbuild and
# `vsce package` for every target.
name: build-vscode

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "CLI version to bundle (default: latest)"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install @vscode/vsce
        run: bun install -g @vscode/vsce

      - name: Stage prebuilt CLI platform packages
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.cli_version || 'latest' }}"
          dist=packages/opencode/dist
          rm -rf "$dist"
          mkdir -p "$dist/@kilocode"
          for pkg in linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            dir="$dist/@kilocode/cli-$pkg"
            tmp="$(mktemp -d)"
            npm pack "@kilocode/cli-$pkg@$version" --pack-destination "$tmp" --silent
            tar -xzf "$tmp"/*.tgz -C "$tmp"
            mkdir -p "$dir"
            cp -r "$tmp/package/." "$dir/"
            rm -rf "$tmp"
            test -f "$dir/bin/kilo" || test -f "$dir/bin/kilo.exe"
            test -f "$dir/bin/kilo-sandbox-mutation-worker.js"
            test -f "$dir/bin/tree-sitter/tree-sitter.wasm"
            echo "staged @kilocode/cli-$pkg"
          done

      - name: Build VSIX packages
        working-directory: ./packages/kilo-vscode
        run: bun script/build.ts
        env:
          CLI_DIST_DIR: ../../packages/opencode/dist

      - name: Upload VSIX artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kilo-vscode
          path: packages/kilo-vscode/out
          if-no-files-found: error
